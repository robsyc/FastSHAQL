# Two ways to build a root set:
#   works        — ex:Work is a sh:ShapeClass: targeting is subclass-closing,
#                  so leaf-typed novels, manga, atlases and archived prints
#                  all surface here
#   fictionworks — a derived target: shnex:instancesOf ex:Fiction computes
#                  the root set from the class tree at query time
{
  works {
    title
  }
  fictionworks {
    title
  }
}
