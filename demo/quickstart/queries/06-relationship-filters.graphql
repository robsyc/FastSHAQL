# Filters reach through relationships (lowered to FILTER EXISTS) — here
# through author, and through the inverse loans field with an enum value.
# The selection nests three levels deep in the same single SPARQL query.
{
  work(where: { author: { displayName: { eq: "J.K. Rowling" } } }) {
    title
    authorName
  }
  member(where: { loans: { status: { eq: ACTIVE } } }) {
    displayName
    loans {
      status
      dueOn
      fine
      work {
        authorName
      }
    }
  }
}
