"""The same relationship can be filtered and selected: the constraint picks
Monet's work, and the response still walks the artist link to show the
gallery behind it — filtering narrows the works, never the selection."""
query RelationshipSelectedAndFiltered {
  artwork(where: { artist: { name: { contains: "Monet" } } }) {
    title
    artist {
      name
      representedBy {
        name
        city
      }
    }
  }
}
