"""Filters reach through parent bundles exactly like selections: finding
the on-site workshops hosted by Pia constrains a format inherited from
the program-item bundle and, one level further up, matches the host by
name inside the bundle's relationship."""
query InheritedCombinedFilter {
  workshop(where: { format: { eq: IN_PERSON }, host: { name: { eq: "Pia Lindqvist" } } }) {
    iri
    skillLevel
    venue {
      name
    }
  }
}
