"""A union can be derived: every article surfaces the same editor's picks,
and a value matching no member — a sidebar widget — is dropped instead of
appearing half-selected.
In the SPARQL: the picks are constant IRIs, not triples at a path."""
query PolymorphicDerivedUnion {
  article {
    title
    picks {
      ... on Paragraph {
        text
      }
      ... on Image {
        url
      }
    }
  }
}
